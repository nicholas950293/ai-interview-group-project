<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>線上測驗｜AI 智慧招聘與技術考核系統</title>
  <meta name="robots" content="noindex">
  <!--
    舊路徑的轉址頁（FR-106）。

    應徵者作答頁已移至 /candidate/assessment.html，但測驗連結的效期是 7 天，
    寄出去的信不能追回來——這一頁的存在就是為了讓那些連結不失效。
    token 以原樣轉送，不做任何解析或儲存。

    移除時機為獨立決策；最早不得早於最後一封含舊路徑的邀請信逾期之後。
  -->
</head>
<body>
  <p>正在前往線上測驗頁面…</p>
  <p><a id="manual-link" href="./candidate/assessment.html">若未自動跳轉，請點此繼續</a></p>

  <script>
    // 保留完整查詢字串（含 token），路徑以外的一切都不改動
    var target = './candidate/assessment.html' + window.location.search + window.location.hash;
    document.getElementById('manual-link').href = target;
    // replace 而非 assign：使用者按上一頁時不該又被彈回這一頁
    window.location.replace(target);
  </script>
</body>
</html>
