<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>線上測驗｜AI 智慧招聘與技術考核系統</title>
  <!-- Tailwind 為體驗；fallback.css 保證 CDN 不可用時頁面仍可讀（NFR-007） -->
  <link rel="stylesheet" href="./css/fallback.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <h1 id="job-title" class="text-lg font-semibold">線上測驗</h1>
      <div class="text-sm text-slate-500">
        <span id="expires-at"></span>
        <span id="trial-remaining" class="ml-4"></span>
      </div>
    </div>
  </header>

  <!-- 逾期、題目準備中、已提交、載入失敗等狀態的單一提示區（FR-108～FR-110） -->
  <div id="notice" role="status" aria-live="polite" hidden
       class="hidden max-w-3xl mx-auto mt-10 rounded border p-6 text-sm"></div>

  <main id="workspace" hidden class="hidden max-w-7xl mx-auto px-6 py-6 grid gap-6 lg:grid-cols-[1fr_1fr]">

    <section aria-labelledby="question-heading" class="space-y-4">
      <article class="bg-white rounded border border-slate-200 p-4">
        <h2 id="question-heading" class="sr-only">題目</h2>
        <h3 id="question-title" class="text-base font-semibold"></h3>
        <div id="question-description" class="mt-3 whitespace-pre-wrap text-sm"></div>
        <div id="question-constraints" hidden class="mt-3 whitespace-pre-wrap text-sm text-slate-600"></div>
        <div id="sample-cases" hidden class="mt-4 space-y-2 text-xs"></div>
      </article>

      <!-- AI 助教（FR-128～FR-131）。故障時只影響這個區塊。 -->
      <article aria-labelledby="chat-heading" class="bg-white rounded border border-slate-200 flex flex-col" style="max-height:420px">
        <h2 id="chat-heading" class="px-4 py-3 text-sm font-semibold border-b border-slate-200">
          AI 助教<span class="ml-2 font-normal text-xs text-slate-500">提供觀念引導，不提供完整解答</span>
        </h2>
        <div id="chat-log" role="log" aria-live="polite" class="flex-1 overflow-y-auto px-4 py-3 space-y-3 text-sm"></div>
        <form id="chat-form" class="border-t border-slate-200 p-3 flex gap-2">
          <label for="chat-input" class="sr-only">向 AI 助教提問</label>
          <input id="chat-input" class="flex-1 rounded border border-slate-300 p-2 text-sm" placeholder="輸入問題…" autocomplete="off">
          <button type="submit" class="rounded bg-slate-900 px-3 py-2 text-sm text-white">送出</button>
        </form>
        <p id="chat-error" role="alert" hidden class="hidden px-4 pb-3 text-xs text-amber-700"></p>
      </article>
    </section>

    <section aria-labelledby="answer-heading" class="space-y-4">
      <h2 id="answer-heading" class="sr-only">作答</h2>

      <div class="bg-white rounded border border-slate-200">
        <div class="flex items-center justify-between border-b border-slate-200 px-4 py-2">
          <label id="language-field" class="text-sm" for="language-select">語言
            <select id="language-select" class="ml-2 rounded border border-slate-300 p-1 text-sm">
              <option value="javascript">JavaScript</option>
              <option value="python">Python</option>
              <option value="go">Go</option>
              <option value="java">Java</option>
              <option value="cpp">C++</option>
            </select>
          </label>
          <div class="flex gap-2">
            <button id="btn-run" type="button" class="rounded border border-slate-300 px-3 py-1.5 text-sm">試跑</button>
            <button id="btn-submit" type="button" class="rounded bg-slate-900 px-3 py-1.5 text-sm text-white">提交作答</button>
          </div>
        </div>
        <!-- 工程類：CodeMirror 掛載點；非工程類：文字作答（FR-112、FR-113） -->
        <div id="code-editor" class="min-h-[320px]"></div>
        <label for="text-answer" class="sr-only">文字作答</label>
        <textarea id="text-answer" rows="16" hidden class="hidden w-full p-4 text-sm" placeholder="請於此處作答…"></textarea>
        <p id="submit-error" role="alert" hidden class="hidden px-4 pb-3 text-xs text-red-700"></p>
      </div>

      <div id="run-panel" class="bg-white rounded border border-slate-200">
        <div class="flex items-center justify-between border-b border-slate-200 px-4 py-2 text-sm">
          <span class="font-semibold">執行結果</span>
          <span id="run-meta" class="text-xs text-slate-500"></span>
        </div>
        <label id="stdin-field" class="block px-4 pt-3 text-xs text-slate-500" for="run-stdin">標準輸入
          <textarea id="run-stdin" rows="2" class="mt-1 w-full rounded border border-slate-300 p-2 font-mono text-xs"></textarea>
        </label>
        <pre id="run-output" aria-live="polite" class="px-4 py-3 text-xs whitespace-pre-wrap font-mono"></pre>
      </div>
    </section>
  </main>

  <!-- 提交前確認（FR-123、FR-124）。不支援 <dialog> 時 answer.js 退回 window.confirm。 -->
  <dialog id="submit-dialog" class="rounded border border-slate-300 p-0 max-w-md">
    <form method="dialog" class="p-5 space-y-4 text-sm">
      <h2 class="text-base font-semibold">確認提交作答</h2>
      <p>提交後將無法修改作答，也不能再次提交。確定要提交嗎？</p>
      <div class="flex justify-end gap-2">
        <button value="cancel" class="rounded border border-slate-300 px-3 py-1.5">返回作答</button>
        <button value="confirm" class="rounded bg-slate-900 px-3 py-1.5 text-white">確定提交</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
