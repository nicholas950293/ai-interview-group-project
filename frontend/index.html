<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考核總覽｜AI 智慧招聘與技術考核系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <h1 class="text-lg font-semibold">考核總覽<span class="ml-2 text-sm font-normal text-slate-500">HR</span></h1>
      <div class="flex items-center gap-3">
        <span id="current-user" class="text-sm text-slate-500"></span>
        <button id="btn-new" class="rounded bg-slate-900 px-4 py-2 text-sm text-white">新增考核</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6 space-y-6">

    <section aria-label="篩選" class="bg-white rounded border border-slate-200 p-4">
      <form id="filter-form" class="grid gap-3 sm:grid-cols-4">
        <label class="text-sm">部門
          <select id="filter-dept" class="mt-1 w-full rounded border-slate-300 border p-2 text-sm">
            <option value="">全部</option>
          </select>
        </label>
        <label class="text-sm">狀態
          <select id="filter-status" class="mt-1 w-full rounded border-slate-300 border p-2 text-sm">
            <option value="">全部</option>
            <option value="PENDING_ASSIGN">待指派題目</option>
            <option value="PENDING_CANDIDATE">待應徵者作答</option>
            <option value="COMPLETED_AWAITING_REVIEW">待主管審核</option>
            <option value="DECIDED">已決策</option>
            <option value="EXPIRED">已逾期</option>
          </select>
        </label>
        <label class="text-sm">應徵職稱
          <input id="filter-job" type="text" class="mt-1 w-full rounded border-slate-300 border p-2 text-sm">
        </label>
        <div class="flex items-end">
          <button type="submit" class="rounded border border-slate-300 px-4 py-2 text-sm">篩選</button>
        </div>
      </form>
    </section>

    <section aria-label="考核清單" class="bg-white rounded border border-slate-200 overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-100 text-left">
          <tr>
            <th class="px-4 py-2">姓名</th>
            <th class="px-4 py-2">應徵職稱</th>
            <th class="px-4 py-2">部門</th>
            <th class="px-4 py-2">責任主管</th>
            <th class="px-4 py-2">狀態</th>
            <th class="px-4 py-2">決策結果</th>
            <th class="px-4 py-2">通知</th>
            <th class="px-4 py-2">操作</th>
          </tr>
        </thead>
        <tbody id="assessment-rows"></tbody>
      </table>
      <p id="empty-hint" class="hidden px-4 py-6 text-sm text-slate-500">目前沒有符合條件的考核。</p>
    </section>
  </main>

  <!-- 新增考核 -->
  <dialog id="dialog-create" class="rounded border border-slate-200 p-0 w-full max-w-lg">
    <form id="create-form" class="p-6 space-y-4">
      <h2 class="text-base font-semibold">新增考核</h2>
      <label class="block text-sm">姓名<input name="name" required maxlength="100" class="mt-1 w-full rounded border border-slate-300 p-2"></label>
      <label class="block text-sm">Email<input name="email" type="email" required maxlength="150" class="mt-1 w-full rounded border border-slate-300 p-2"></label>
      <label class="block text-sm">聯絡電話<input name="phone" maxlength="50" class="mt-1 w-full rounded border border-slate-300 p-2"></label>
      <label class="block text-sm">應徵職稱<input name="job_title" required maxlength="100" class="mt-1 w-full rounded border border-slate-300 p-2"></label>
      <label class="block text-sm">部門
        <select name="dept_id" id="create-dept" required class="mt-1 w-full rounded border border-slate-300 p-2"></select>
      </label>
      <p id="create-error" class="hidden text-sm text-red-600"></p>
      <div class="flex justify-end gap-2">
        <button type="button" id="create-cancel" class="rounded border border-slate-300 px-4 py-2 text-sm">取消</button>
        <button type="submit" class="rounded bg-slate-900 px-4 py-2 text-sm text-white">建立</button>
      </div>
    </form>
  </dialog>

  <!-- 通知預覽（FR-069）-->
  <dialog id="dialog-notify" class="rounded border border-slate-200 p-0 w-full max-w-2xl">
    <form id="notify-form" class="p-6 space-y-4">
      <h2 class="text-base font-semibold">結果通知預覽</h2>
      <p class="text-xs text-slate-500">通知內容不含主管內部評語與 AI 評測報告（FR-070）。</p>
      <label class="block text-sm">主旨<input name="subject" required class="mt-1 w-full rounded border border-slate-300 p-2"></label>
      <label class="block text-sm">內文<textarea name="body" rows="12" required class="mt-1 w-full rounded border border-slate-300 p-2 font-mono text-xs"></textarea></label>
      <p id="notify-status" class="hidden text-sm"></p>
      <div class="flex justify-end gap-2">
        <button type="button" id="notify-cancel" class="rounded border border-slate-300 px-4 py-2 text-sm">取消</button>
        <button type="submit" class="rounded bg-slate-900 px-4 py-2 text-sm text-white">發送</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./js/hr.js"></script>
</body>
</html>
