[pytest]
; 測試分為兩組，見 research.md R-008。
;   預設套件（離線）：pytest -m "not security"
;   安全套件（需 Docker）：pytest -m security
; 預設排除 security，使「直接執行 pytest」即為憲章原則 II 要求的離線套件。
addopts = -m "not security" --strict-markers
markers =
    security: 需要本機 Docker 的沙箱隔離驗證（憲章「安全關卡」）
    postgres: 需要本機 PostgreSQL 的 RLS 政策驗證（未設定 TEST_DATABASE_URL 時自動跳過）

testpaths = tests
pythonpath = ..
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
